name: Update stats SVGs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/stats.yml']

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats SVGs
        run: |
          # github-readme-stats.vercel.app es una instancia publica compartida y
          # devuelve 503 cuando agota su cuota en Vercel. Eso no es un fallo de
          # este repo: los SVG del commit anterior siguen siendo validos. Se
          # descarga a un temporal y solo se sustituye lo que llego entero.
          BASE="https://github-readme-stats.vercel.app/api"
          USER="jrodeiro5"
          mkdir -p assets tmp

          fetch() {  # fetch <url> <destino>
            if curl -fsSL --retry 3 --retry-delay 15 --max-time 60 "$1" -o "tmp/out.svg" \
               && [ -s tmp/out.svg ] && head -c 5 tmp/out.svg | grep -q '<svg'; then
              mv tmp/out.svg "$2"
            else
              echo "::warning::no se pudo refrescar $2, se conserva el anterior"
            fi
          }

          fetch "$BASE?username=$USER&show_icons=true&hide_border=true&bg_color=00000000&title_color=fafafa&text_color=a1a1aa&icon_color=fafafa&count_private=true&hide=issues&card_width=440" assets/stats-dark.svg
          fetch "$BASE?username=$USER&show_icons=true&hide_border=true&bg_color=ffffff00&title_color=0a0a0a&text_color=52525b&icon_color=0a0a0a&count_private=true&hide=issues&card_width=440" assets/stats-light.svg
          fetch "$BASE/top-langs/?username=$USER&layout=compact&hide_border=true&bg_color=00000000&title_color=fafafa&text_color=a1a1aa&langs_count=8&card_width=440" assets/langs-dark.svg
          fetch "$BASE/top-langs/?username=$USER&layout=compact&hide_border=true&bg_color=ffffff00&title_color=0a0a0a&text_color=52525b&langs_count=8&card_width=440" assets/langs-light.svg
          rm -rf tmp

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats SVGs"
          git push
