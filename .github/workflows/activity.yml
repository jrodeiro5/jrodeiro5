name: activity

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with fonttools --with brotli design/profile.py
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - run: |
          git add assets
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(assets): refresh activity"
          git push
